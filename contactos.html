<head>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --negro-fondo: #0a0a0a;
            --negro-tarjeta: #1a1a1a;
            --dorado: #d4af37; 
            --dorado-brillante: #f9e27d;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--negro-fondo);
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            margin: 0;
            color: var(--blanco);
        }

        /* --- ESTILOS NAV --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10%;
            border-bottom: 1px solid var(--dorado);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-img {
            height: 45px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: var(--dorado); /* Ajustado a tu paleta */
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--dorado-brillante);
        }

        /* --- CUERPO DE LA PÁGINA --- */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px); /* Resta el espacio del nav */
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
        }

        .profile-border {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            padding: 5px;
            background: linear-gradient(45deg, var(--dorado), var(--dorado-brillante), var(--dorado));
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--negro-fondo);
            display: block;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--dorado);
            font-size: 2rem;
            margin: 0.5rem 0;
        }

        .subtitle {
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            opacity: 0.7;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            background: var(--negro-tarjeta);
            color: var(--blanco);
            text-decoration: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .link-item:hover {
            border-color: var(--dorado-brillante);
            transform: translateY(-3px);
            background: #222;
        }

        footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: var(--dorado);
            opacity: 0.8;
            text-align: center;
            padding-bottom: 20px;
        }
    </style>
</head>
